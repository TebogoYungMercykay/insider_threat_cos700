[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: reads or re-aggregates the raw CERT logs (minutes, needs data/raw/)

# The fast suite -- everything that needs no CERT data -- runs in seconds:
#     pytest -m "not slow"
#
# The full suite additionally re-derives features straight from data/raw/ and
# checks them against the aggregated table. Those tests are the reason the
# aggregation can be trusted, so they are not optional before a release; they
# are marked only so that day-to-day model work is not gated on a 3-minute
# scan of 93 GB of logs.
